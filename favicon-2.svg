<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="dGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGradient2)"/>
  
  <!-- Letter D with Globe Inside -->
  <text x="50" y="68" font-family="Inter, system-ui, sans-serif" font-size="55" font-weight="700" fill="url(#dGradient)" text-anchor="middle">D</text>
  
  <!-- Globe Arc -->
  <path d="M 30 35 Q 50 25 70 35" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Data Dots -->
  <circle cx="25" cy="50" r="3" fill="#10b981"/>
  <circle cx="75" cy="50" r="3" fill="#f59e0b"/>
  <circle cx="50" cy="78" r="3" fill="#ef4444"/>
</svg>